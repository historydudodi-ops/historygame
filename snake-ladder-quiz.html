<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>역사 뱀사다리 퀴즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#6ea8ff; --sky2:#5b94f0;
  --panel:#fdfbf2; --ink:#1a1530; --muted:#5d5873;
  --line:#1a1530; --shadow:#1a1530;
  --cellA:#f6c77e; --cellB:#eaa95c;
  --brick:#c8532e; --gold:#ffd23f; --mint:#43d18a; --pink:#ff6fae; --violet:#8a63ff;
  --qcell:#9fd8ff; --itemcell:#ffe77a;
  --good:#1fa65a; --bad:#e2412f;
  --px:"Press Start 2P", "Do Hyeon", monospace;
  --ko:"Do Hyeon", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky:#1c1a44; --sky2:#16143a;
    --panel:#2a2658; --ink:#f5f1ff; --muted:#b5addb;
    --line:#07061a; --shadow:#000;
    --cellA:#3e3780; --cellB:#332d6c;
    --qcell:#1f5f8f; --itemcell:#7d6a18;
  }
}
:root[data-theme="dark"]{
  --sky:#1c1a44; --sky2:#16143a;
  --panel:#2a2658; --ink:#f5f1ff; --muted:#b5addb;
  --line:#07061a; --shadow:#000;
  --cellA:#3e3780; --cellB:#332d6c;
  --qcell:#1f5f8f; --itemcell:#7d6a18;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--sky);
  background-image:linear-gradient(var(--sky2) 2px, transparent 2px),linear-gradient(90deg,var(--sky2) 2px, transparent 2px);
  background-size:32px 32px;
  color:var(--ink); font-family:var(--ko); font-size:18px;
  -webkit-tap-highlight-color:transparent; user-select:none;
}
body::after{content:"";position:fixed;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.05) 0 2px,transparent 2px 4px);z-index:999}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.hidden{display:none!important}

.box{background:var(--panel);border:4px solid var(--line);box-shadow:6px 6px 0 var(--shadow)}
.btn{border:4px solid var(--line);background:var(--gold);color:#1a1530;padding:10px 16px;cursor:pointer;
  box-shadow:4px 4px 0 var(--shadow);font-family:var(--ko);font-size:20px;line-height:1.2}
.btn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--shadow)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.chip:focus-visible{outline:3px dashed var(--pink);outline-offset:3px}
.btn.alt{background:#fff}
.btn.red{background:var(--brick);color:#fff}
.btn.green{background:var(--mint)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.big{font-size:26px;padding:14px 20px}

/* ---------- SETUP ---------- */
#setup{min-height:100%;display:flex;justify-content:center;padding:24px 16px 48px}
.setup-inner{width:100%;max-width:880px}
.title{text-align:center;margin:12px 0 24px}
.title .logo{font-family:"Press Start 2P",monospace;font-size:clamp(20px,4.6vw,40px);color:var(--gold);
  text-shadow:4px 4px 0 var(--line),-2px -2px 0 var(--line),2px -2px 0 var(--line),-2px 2px 0 var(--line);letter-spacing:2px;line-height:1.4}
.title .ko{font-size:clamp(26px,5vw,44px);color:#fff;text-shadow:3px 3px 0 var(--line);margin-top:6px}
.title .blink{font-family:"Press Start 2P",monospace;font-size:12px;color:#fff;text-shadow:2px 2px 0 var(--line);margin-top:14px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.setup-card{padding:20px;margin-bottom:18px}
.setup-card h2{margin:0 0 12px;font-size:24px;font-weight:normal;display:flex;align-items:center;gap:10px}
.setup-card h2 .n{font-family:"Press Start 2P",monospace;font-size:12px;background:var(--line);color:var(--gold);padding:6px 8px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mode{border:4px solid var(--line);padding:16px;cursor:pointer;background:var(--panel);text-align:left;box-shadow:4px 4px 0 var(--shadow)}
.mode .ic{font-size:40px}
.mode b{display:block;font-size:26px;font-weight:normal;margin:4px 0}
.mode span{color:var(--muted);font-size:17px}
.mode.on{background:var(--gold);color:#1a1530}
.mode.on span{color:#4a3f2a}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0}
.row label.lbl{min-width:130px;font-size:20px}
.chip{border:3px solid var(--line);padding:8px 14px;background:var(--panel);cursor:pointer;font-size:19px;box-shadow:3px 3px 0 var(--shadow)}
.chip.on{background:var(--violet);color:#fff}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:8px}
.names .nm{display:flex;align-items:center;gap:8px;border:3px solid var(--line);padding:6px 8px;background:var(--panel)}
.names input{border:none;background:transparent;width:100%;font-size:20px;outline:none}
.swatch{width:26px;height:26px;border:3px solid var(--line);flex:none;display:grid;place-items:center;font-family:"Press Start 2P";font-size:9px;color:#fff;text-shadow:1px 1px 0 #000}
.hint{color:var(--muted);font-size:16px;line-height:1.5}
textarea#qtext{width:100%;min-height:220px;border:3px solid var(--line);background:var(--panel);padding:10px;font-size:17px;line-height:1.5;resize:vertical;user-select:text;font-family:var(--ko)}
.fmt{background:var(--line);color:#e9e4ff;padding:12px 14px;font-size:16px;line-height:1.7;overflow-x:auto;white-space:pre;user-select:text}
.fmt em{color:var(--gold);font-style:normal}
.qstatus{font-size:18px;margin-left:auto}
.qstatus.ok{color:var(--good)} .qstatus.err{color:var(--bad)}
details summary{cursor:pointer;font-size:20px;list-style:none}
details summary::before{content:"▶ ";font-size:14px}
details[open] summary::before{content:"▼ "}
.start-wrap{text-align:center;margin-top:8px}

/* ---------- GAME ---------- */
#game{height:100vh;height:100dvh;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px;padding:12px}
.board-wrap{display:flex;align-items:center;justify-content:center;min-height:0;min-width:0}
.board{position:relative;width:min(100%, calc((100dvh - 24px) * var(--ar)));aspect-ratio:var(--ar);
  border:5px solid var(--line);box-shadow:8px 8px 0 var(--shadow);container-type:inline-size;background:var(--line)}
.cells{position:absolute;inset:0;display:grid;gap:0}
.cell{position:relative;border:1px solid rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;overflow:hidden}
.cell.a{background:var(--cellA)} .cell.b{background:var(--cellB)}
.cell.q{background:var(--qcell)} .cell.item{background:var(--itemcell)}
.cell.goal{background:repeating-conic-gradient(#fff 0 25%, #1a1530 0 50%) 0 0/ 25% 25%}
.cell .num{position:absolute;top:3%;left:5%;font-family:"Press Start 2P",monospace;font-size:calc(100cqw / var(--cols) * .14);color:var(--ink);opacity:.75}
.cell .ic{font-size:calc(100cqw / var(--cols) * .38);line-height:1;filter:drop-shadow(2px 2px 0 rgba(0,0,0,.35))}
.cell .qm{font-family:"Press Start 2P",monospace;font-size:calc(100cqw / var(--cols) * .3);color:#fff;text-shadow:3px 3px 0 var(--line)}
.cell.goal .ic{background:var(--gold);padding:4% 6%;border:3px solid var(--line);font-family:"Press Start 2P",monospace;font-size:calc(100cqw / var(--cols) * .12);filter:none;color:#1a1530}
.cell.start .ic{font-family:"Press Start 2P",monospace;font-size:calc(100cqw / var(--cols) * .11);filter:none;background:var(--mint);padding:4% 6%;border:3px solid var(--line);color:#1a1530}
svg.overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tokens{position:absolute;inset:0;pointer-events:none}
.token{position:absolute;width:calc(100% / var(--cols) * .4);aspect-ratio:1;transform:translate(-50%,-50%);
  border:3px solid var(--line);display:grid;place-items:center;font-family:"Press Start 2P",monospace;
  font-size:calc(100cqw / var(--cols) * .15);color:#fff;text-shadow:2px 2px 0 #000;
  box-shadow:3px 3px 0 rgba(0,0,0,.5);transition:left .18s steps(3), top .18s steps(3);border-radius:0}
.token.fly{transition:left .7s ease-in-out, top .7s ease-in-out}
.token.me{z-index:5;animation:hop .6s steps(2) infinite}
@keyframes hop{50%{margin-top:-6px}}

.side{display:flex;flex-direction:column;gap:12px;min-height:0}
.turnbox{padding:14px;text-align:center}
.turnbox .lab{font-family:"Press Start 2P",monospace;font-size:10px;color:var(--muted)}
.turnbox .who{font-size:30px;margin:6px 0 10px;display:flex;align-items:center;justify-content:center;gap:10px}
.dice{width:92px;height:92px;margin:0 auto 12px;background:#fff;border:5px solid var(--line);box-shadow:5px 5px 0 var(--shadow);
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:10px;cursor:pointer}
.dice i{display:block;width:16px;height:16px;background:var(--line);margin:auto;visibility:hidden}
.dice i.on{visibility:visible}
.dice.shake{animation:shake .1s steps(2) infinite}
@keyframes shake{0%{transform:rotate(-8deg)}100%{transform:rotate(8deg)}}
#rollBtn{width:100%}
.players{padding:10px;overflow:auto;flex:1;min-height:120px}
.pl{display:flex;align-items:center;gap:10px;padding:8px;border:3px solid transparent;margin-bottom:4px}
.pl.cur{border-color:var(--line);background:var(--gold);color:#1a1530}
.pl .pn{flex:1;font-size:21px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .pp{font-family:"Press Start 2P",monospace;font-size:12px}
.pl .st{font-size:15px;opacity:.85}
.logbox{padding:10px 12px;font-size:16px;line-height:1.45;max-height:150px;overflow:auto}
.logbox div{border-bottom:2px dotted rgba(128,128,128,.4);padding:3px 0}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools .btn{flex:1;font-size:16px;padding:8px 6px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:15px;padding:10px 12px}

@media (max-width:900px), (orientation:portrait){
  #game{grid-template-columns:1fr;height:auto;min-height:100dvh}
  .board{width:min(100%, calc((100dvh - 330px) * var(--ar)))}
  .side{display:grid;grid-template-columns:1fr 1fr;align-items:start}
  .side .turnbox{grid-row:span 2}
  .side .logbox,.side .tools,.side .legend{grid-column:1 / -1}
}
@media (max-width:560px){
  .side{grid-template-columns:1fr}
  .board{width:100%}
  .modes{grid-template-columns:1fr}
}

/* ---------- MODAL ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(10,8,30,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{width:min(720px,100%);max-height:92dvh;overflow:auto;padding:22px;animation:pop .22s steps(3)}
@keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}
.modal .mh{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.modal .mh .big{font-size:44px}
.modal .mh h3{margin:0;font-weight:normal;font-size:32px}
.modal .sub{color:var(--muted);font-size:19px;margin-bottom:12px}
.qbox{background:var(--line);color:#fff;padding:18px;font-size:clamp(22px,3.2vw,30px);line-height:1.45;margin:10px 0 14px;user-select:text;word-break:keep-all}
.qtag{display:inline-block;font-family:"Press Start 2P",monospace;font-size:10px;background:var(--pink);color:#fff;padding:5px 7px;margin-bottom:10px}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{text-align:left;font-size:clamp(19px,2.6vw,24px);background:var(--panel);color:var(--ink);display:flex;gap:10px;align-items:flex-start;word-break:keep-all}
.opts.two .opt{justify-content:center;font-family:"Press Start 2P",monospace;font-size:40px;padding:18px}
.opt .k{font-family:"Press Start 2P",monospace;font-size:14px;background:var(--line);color:var(--gold);padding:5px 7px;flex:none;margin-top:2px}
.opt.right{background:var(--mint);color:#1a1530}
.opt.wrong{background:var(--bad);color:#fff}
.timer{height:16px;border:3px solid var(--line);background:var(--panel);margin-bottom:10px}
.timer div{height:100%;background:var(--mint);width:100%}
.timer.warn div{background:var(--bad)}
.result{margin-top:14px;padding:14px;border:4px solid var(--line);font-size:22px;line-height:1.5}
.result.ok{background:#c8f5d9;color:#0e3b22} .result.no{background:#ffd0c8;color:#4a0f06}
.result .ans{font-size:26px}
.mfoot{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.center{text-align:center}
.item-anim{font-size:90px;text-align:center;animation:spin .5s steps(4)}
@keyframes spin{from{transform:rotate(-180deg) scale(.3)}to{transform:none}}
.rank{width:100%;border-collapse:collapse;font-size:21px;margin-top:8px}
.rank td,.rank th{border-bottom:2px dashed rgba(128,128,128,.5);padding:8px 6px;text-align:left;font-weight:normal}
.rank th{color:var(--muted);font-size:17px}
.wronglist{margin-top:10px;font-size:18px;line-height:1.5}
.wronglist div{padding:8px 0;border-bottom:2px dotted rgba(128,128,128,.5)}
.wronglist b{font-weight:normal;color:var(--brick)}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:60;padding:10px 18px;font-size:22px;animation:pop .2s steps(3)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:49;overflow:hidden}
.confetti i{position:absolute;width:12px;height:12px;top:-20px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh)}}
/* ---------- 인생역전 ---------- */
.lifeswap{position:fixed;inset:0;z-index:70;display:grid;place-items:center;overflow:hidden;animation:lsFlash .16s steps(1) infinite}
@keyframes lsFlash{0%{background:#ff2b6b}25%{background:#ffd23f}50%{background:#3d8bff}75%{background:#43d18a}}
.lifeswap .rays{position:absolute;left:50%;top:50%;width:250vmax;height:250vmax;transform:translate(-50%,-50%);
  background:repeating-conic-gradient(rgba(255,255,255,.55) 0 7deg, rgba(255,255,255,0) 7deg 14deg);animation:lsSpin 4s linear infinite}
@keyframes lsSpin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.lifeswap .inner{position:relative;text-align:center;width:min(640px,94vw)}
.lifeswap .word{font-size:clamp(46px,13vw,108px);color:#fff;line-height:1.1;letter-spacing:3px;
  text-shadow:6px 6px 0 var(--line),-4px -4px 0 var(--line),4px -4px 0 var(--line),-4px 4px 0 var(--line),0 0 28px #ffd23f;
  animation:lsPop .3s steps(3), lsWob .22s steps(2) .3s infinite}
@keyframes lsPop{from{transform:scale(.2) rotate(-25deg)}to{transform:none}}
@keyframes lsWob{0%{transform:rotate(-3deg) scale(1)}100%{transform:rotate(3deg) scale(1.07)}}
.lifeswap .swapline{position:relative;display:flex;gap:64px;margin:26px 0 16px}
.lifeswap .pc{flex:1 1 0;min-width:0;background:var(--panel);border:5px solid var(--line);box-shadow:6px 6px 0 rgba(0,0,0,.45);
  padding:12px 6px;font-size:clamp(17px,3.4vw,23px);color:var(--ink);opacity:0}
.lifeswap .pc b{font-weight:normal;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lifeswap .pc .pcn{font-family:"Press Start 2P",monospace;font-size:13px;margin-top:8px;display:block}
@keyframes lsIn{to{opacity:1}}
.lifeswap .pc.l{animation:lsIn .2s steps(2) .35s forwards, lsGoR .9s steps(7) .9s forwards}
.lifeswap .pc.r{animation:lsIn .2s steps(2) .35s forwards, lsGoL .9s steps(7) .9s forwards}
@keyframes lsGoR{to{transform:translateX(calc(100% + 64px))}}
@keyframes lsGoL{to{transform:translateX(calc(-100% - 64px))}}
.lifeswap .arrows{position:absolute;left:50%;top:50%;font-size:46px;text-shadow:3px 3px 0 var(--line);
  animation:lsArrow .3s steps(2) infinite}
@keyframes lsArrow{0%{transform:translate(-50%,-50%) scale(1)}100%{transform:translate(-50%,-50%) scale(1.35)}}
.lifeswap .tagline{font-size:clamp(20px,4vw,30px);color:#fff;text-shadow:3px 3px 0 var(--line);opacity:0;animation:lsIn .2s steps(2) 1.9s forwards}
.quake{animation:quake .12s steps(2) 12}
@keyframes quake{0%{transform:translate(-6px,3px)}100%{transform:translate(6px,-3px)}}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important}
  .token,.token.fly{transition:none}
}
</style>
</head>
<body>

<!-- ================= SETUP ================= -->
<section id="setup">
  <div class="setup-inner">
    <div class="title">
      <div class="logo">SNAKE&amp;LADDER</div>
      <div class="ko">역사 뱀사다리 퀴즈</div>
      <div class="blink">INSERT COIN</div>
    </div>

    <div class="box setup-card">
      <h2><span class="n">1P</span>게임 모드</h2>
      <div class="modes">
        <button class="mode on" data-mode="team" type="button">
          <div class="ic">👥</div><b>함께 하기</b>
          <span>태블릿 한 대로 2~6명이 번갈아 가며 대결해요.</span>
        </button>
        <button class="mode" data-mode="solo" type="button">
          <div class="ic">🎮</div><b>개인 복습 모드</b>
          <span>혼자 도전하고, 끝나면 틀린 문제를 다시 볼 수 있어요.</span>
        </button>
      </div>
      <div id="teamOpts">
        <div class="row" style="margin-top:16px">
          <label class="lbl">인원 수</label>
          <div id="teamCount" class="row" style="margin:0"></div>
        </div>
        <div class="names" id="names"></div>
      </div>
      <div id="soloOpts" class="hidden">
        <div class="row" style="margin-top:16px">
          <label class="lbl" for="soloName">이름</label>
          <div class="names" style="margin:0;flex:1;max-width:260px">
            <div class="nm"><span class="swatch" style="background:#ff5c5c">1</span><input id="soloName" maxlength="10" value="나"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="box setup-card">
      <h2><span class="n">2P</span>게임 설정</h2>
      <div class="row"><label class="lbl">보드 크기</label>
        <button class="chip" data-size="30" type="button">짧게 · 30칸</button>
        <button class="chip on" data-size="50" type="button">보통 · 50칸</button>
        <button class="chip" data-size="100" type="button">길게 · 100칸</button>
      </div>
      <div class="row"><label class="lbl">퀴즈 규칙</label>
        <button class="chip on" data-rule="event" type="button">사다리·뱀에서 퀴즈</button>
        <button class="chip" data-rule="every" type="button">매 턴 퀴즈 후 주사위</button>
      </div>
      <p class="hint" id="ruleHint" style="margin:0 0 6px"></p>
      <div class="row"><label class="lbl">제한 시간</label>
        <button class="chip on" data-timer="0" type="button">없음</button>
        <button class="chip" data-timer="20" type="button">20초</button>
        <button class="chip" data-timer="30" type="button">30초</button>
        <button class="chip" data-timer="60" type="button">60초</button>
      </div>
      <div class="row"><label class="lbl">도착 규칙</label>
        <button class="chip on" data-exact="1" type="button">정확히 도착 (넘치면 튕김)</button>
        <button class="chip" data-exact="0" type="button">넘어도 도착</button>
      </div>
      <div class="row"><label class="lbl">효과음</label>
        <button class="chip on" data-sound="1" type="button">켜기</button>
        <button class="chip" data-sound="0" type="button">끄기</button>
      </div>
    </div>

    <div class="box setup-card">
      <details id="qDetails">
        <summary>📜 퀴즈 문제 입력 <span id="qCount" class="qstatus"></span></summary>
        <p class="hint">한 줄에 한 문제씩, <b>|</b> 기호로 나눠 적어 주세요. 입력한 문제는 이 태블릿에 저장돼요. 문제는 섞여서 나오고, 다 쓰면 다시 섞어서 나와요.</p>
<div class="fmt"><em>객관식</em>  문제 | 보기1 | 보기2 | 보기3 | 보기4 | 정답번호

function parseQ(text){
  const out=[],errs=[];
  text.split(/\r?\n/).forEach((raw,i)=>{
    const line=raw.trim(); if(!line||line.startsWith('#'))return;
    const parts=line.split('|').map(s=>s.trim());
    let exp='';
    if(parts.length>1&&/^해설\s*[:：]/.test(parts[parts.length-1])) exp=parts.pop().replace(/^해설\s*[:：]\s*/,'');
    if(!parts[0]){errs.push(i+1);return}
    if(parts.length===2&&parts[1]){
      const a=parts[1].toUpperCase();
      if(['O','X','○','×','Ｏ','Ｘ'].includes(a)) out.push({type:'ox',q:parts[0],a:(a==='O'||a==='○'||a==='Ｏ')?'O':'X',exp});
      else out.push({type:'short',q:parts[0],a:parts[1],exp});
    }else if(parts.length>=4){
      const ans=parseInt(parts[parts.length-1],10), opts=parts.slice(1,-1);
      if(ans>=1&&ans<=opts.length&&opts.every(o=>o)) out.push({type:'mc',q:parts[0],opts,a:ans-1,exp});
      else errs.push(i+1);
    }else errs.push(i+1);
  });
  return {out,errs};
}
function applyQ(showMsg){

  }
  return true;
}

let AC=null;
function beep(f=440,d=.08,type='square',vol=.06,delay=0){
  if(!S.sound)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02);
  }catch(e){}
}

function cellRC(n){const i=n-1,r=Math.floor(i/P.cols);return {r,c:r%2===0?i%P.cols:P.cols-1-(i%P.cols)}}
function center(n){const {r,c}=cellRC(n);return {x:(c+.5)*100,y:(P.rows-r-.5)*100}}
function buildBoard(){
  const b=$('#board');b.style.setProperty('--ar',P.cols/P.rows);b.style.setProperty('--cols',P.cols);
  const cells=$('#cells');cells.style.gridTemplateColumns=`repeat(${P.cols},1fr)`;cells.style.gridTemplateRows=`repeat(${P.rows},1fr)`;
  cells.innerHTML='';
  for(let n=1;n<=last();n++){
    const {r,c}=cellRC(n),d=document.createElement('div');
    d.className='cell '+((r+c)%2?'b':'a');d.style.gridRow=P.rows-r;d.style.gridColumn=c+1;
    let ic='';
    if(n===last()){d.classList.add('goal');ic='<span class="ic">GOAL</span>'}
    else if(n===1){d.classList.add('start');ic='<span class="ic">START</span>'}
    else if(P.items[n]){d.classList.add('item');ic=`<span class="ic">${ITEMS[P.items[n]].icon}</span>`}
    else if(P.quiz.includes(n)){d.classList.add('q');ic='<span class="qm">?</span>'}
    d.innerHTML=`<span class="num">${n}</span>${ic}`;
    cells.appendChild(d);
  }
  drawOverlay();
  const lg=[['🪜','사다리 (퀴즈 맞히면 올라감)'],['🐍','뱀 (퀴즈 맞히면 피함)'],['❓','보너스 퀴즈'],...Object.values(ITEMS).map(it=>[it.icon,it.name])];
  $('#legend').innerHTML=lg.map(([i,t])=>`<div>${i} ${t}</div>`).join('');
}
function drawOverlay(){
  const W=P.cols*100,H=P.rows*100,svg=$('#overlay');
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  let out='';
  // 사다리
  for(const [a,b] of Object.entries(P.ladders)){
    const s=center(+a),e=center(b),dx=e.x-s.x,dy=e.y-s.y,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,nx=-uy,ny=ux,w=17;
    const sx=s.x+ux*18,sy=s.y+uy*18,ex=e.x-ux*18,ey=e.y-uy*18;
    const rail=(o,col,sw)=>`<line x1="${sx+nx*o}" y1="${sy+ny*o}" x2="${ex+nx*o}" y2="${ey+ny*o}" stroke="${col}" stroke-width="${sw}" stroke-linecap="square"/>`;
    let rungs='';const cnt=Math.max(2,Math.floor((L-36)/38));
    for(let k=1;k<=cnt;k++){const t=k/(cnt+1),px=sx+(ex-sx)*t,py=sy+(ey-sy)*t;
      rungs+=`<line x1="${px-nx*w}" y1="${py-ny*w}" x2="${px+nx*w}" y2="${py+ny*w}" stroke="#1a1530" stroke-width="10"/><line x1="${px-nx*w}" y1="${py-ny*w}" x2="${px+nx*w}" y2="${py+ny*w}" stroke="#e39a3b" stroke-width="5"/>`}
    out+=`<g opacity=".95">${rail(-w,'#1a1530',11)}${rail(w,'#1a1530',11)}${rungs}${rail(-w,'#b8661f',6)}${rail(w,'#b8661f',6)}</g>`;
  }
  // 뱀
  const SC=['#3cc46a','#9b5cff','#ff5c8a','#1fb3c9','#ff9d2e'];
  Object.entries(P.snakes).forEach(([a,b],i)=>{
    const h=center(+a),t=center(b),dx=t.x-h.x,dy=t.y-h.y,L=Math.hypot(dx,dy),nx=-dy/L,ny=dx/L;
    const waves=Math.max(1.5,L/110),amp=Math.min(26,L*.1);let d='';
    for(let k=0;k<=40;k++){const s=k/40,off=Math.sin(s*Math.PI*waves)*amp*(1-s*.4);
      d+=(k?'L':'M')+(h.x+dx*s+nx*off).toFixed(1)+' '+(h.y+dy*s+ny*off).toFixed(1)}
    const c=SC[i%SC.length];
    out+=`<g><path d="${d}" fill="none" stroke="#1a1530" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="${d}" fill="none" stroke="${c}" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="${d}" fill="none" stroke="#1a1530" stroke-width="13" stroke-dasharray="4 14" opacity=".35"/>
      <rect x="${h.x-19}" y="${h.y-17}" width="38" height="34" fill="${c}" stroke="#1a1530" stroke-width="5"/>
      <rect x="${h.x-11}" y="${h.y-8}" width="8" height="8" fill="#fff"/><rect x="${h.x+3}" y="${h.y-8}" width="8" height="8" fill="#fff"/>
      <rect x="${h.x-8}" y="${h.y-6}" width="4" height="4" fill="#000"/><rect x="${h.x+6}" y="${h.y-6}" width="4" height="4" fill="#000"/>
      <rect x="${h.x-2}" y="${h.y+15}" width="4" height="10" fill="#e2412f"/></g>`;
  });
  svg.innerHTML=out;
}
function renderTokens(){
  const layer=$('#tokens'),groups={};
  S.players.forEach((p,i)=>{(groups[p.pos]=groups[p.pos]||[]).push(i)});
  S.players.forEach((p,i)=>{
    let el=layer.querySelector(`[data-p="${i}"]`);
    if(!el){el=document.createElement('div');el.className='token';el.dataset.p=i;el.style.background=p.color;el.textContent=p.num;layer.appendChild(el)}
    const g=groups[p.pos],k=g.indexOf(i),m=g.length,{r,c}=cellRC(p.pos);
    const cw=100/P.cols,ch=100/P.rows;
    const ox=m>1?((k%2)-.5)*cw*.42:0, rowsN=Math.ceil(m/2), oy=m>1?(Math.floor(k/2)-(rowsN-1)/2)*ch*.36:0;
    el.style.left=((c+.5)*cw+ox)+'%';el.style.top=((P.rows-r-.5)*ch+oy+(m>1?0:ch*.08))+'%';
    el.classList.toggle('me',i===S.idx&&!S.over);
  });
}
function renderPlayers(){
  $('#players').innerHTML=S.players.map((p,i)=>`
    <div class="pl ${i===S.idx&&!S.over?'cur':''}">
      <span class="swatch" style="background:${p.color}">${p.num}</span>
      <span class="pn">${esc(p.name)}</span>
      <span class="st">${p.shield?'🛡️'+(p.shield>1?p.shield:''):''}${p.skip?'💤':''} ✔${p.correct}/${p.total}</span>
      <span class="pp">${p.pos}</span>
    </div>`).join('');
}
function renderTurn(){
  const p=cur();
  $('#turnLab').textContent=S.mode==='solo'?`TURN ${S.turn}`:`ROUND ${S.turn}`;
  $('#who').innerHTML=`<span class="swatch" style="background:${p.color};width:34px;height:34px;font-size:12px">${p.num}</span>${esc(p.name)}`;
  $('#rollBtn').textContent=S.rule==='every'?'❓ 문제 풀고 굴리기':'🎲 주사위 굴리기';
  $('#rollBtn').disabled=S.busy||S.over;
}
function renderAll(){renderTokens();renderPlayers();renderTurn()}
function addLog(t){S.log.unshift(t);S.log=S.log.slice(0,30);$('#log').innerHTML=S.log.map(x=>`<div>${x}</div>`).join('')}
const nm=p=>`<b style="color:${p.color}">${esc(p.name)}</b>`;

/* ===================== 주사위 ===================== */
const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function setDice(n){$('#dice').innerHTML=Array.from({length:9},(_,i)=>`<i class="${PIPS[n].includes(i)?'on':''}"></i>`).join('')}
async function rollDice(){
  const d=$('#dice');d.classList.add('shake');
  for(let i=0;i<12;i++){setDice(1+Math.floor(Math.random()*6));SFX.dice();await sleep(60+i*6)}
  const n=1+Math.floor(Math.random()*6);setDice(n);d.classList.remove('shake');beep(1047,.12);
  await sleep(350);return n;
}

/* ===================== 이동 ===================== */
async function moveSteps(p,n){
  let dir=n>0?1:-1,steps=Math.abs(n);
  for(let s=0;s<steps;s++){
    if(dir>0&&p.pos>=last()){ if(!S.exact)break; dir=-1; toast('↩ 넘쳤다! 튕겨 나와요') }
    p.pos+=dir; if(p.pos<1){p.pos=1;break}
    renderTokens();SFX.step();await sleep(210);
  }
  renderPlayers();
}
async function flyTo(p,to){
  const el=$(`#tokens [data-p="${S.players.indexOf(p)}"]`);
  el.classList.add('fly');p.pos=to;renderTokens();await sleep(750);el.classList.remove('fly');renderPlayers();
}

/* ===================== 턴 진행 ===================== */
async function takeTurn(){
  if(S.busy||S.over)return;
  S.busy=true;renderTurn();
  const p=cur();
  let again=false;
  if(S.rule==='every'){
    const ok=await askQuiz(p,'❓','도전 문제','맞혀야 주사위를 굴릴 수 있어요.');
    if(!ok){addLog(`${nm(p)} 문제를 놓쳐 이번 턴은 이동 못 해요.`);return endTurn(false)}
  }
  const n=await rollDice();
  addLog(`${nm(p)} 🎲 ${n} → ${Math.min(p.pos+n,last())}번 칸 방향`);
  await moveSteps(p,n);
  if(p.pos===last())return win(p);
  again=await resolve(p,0);
  if(p.pos===last())return win(p);
  endTurn(again);
}
function endTurn(again){
  if(S.over)return;
  if(again){toast(`⭐ ${cur().name} 한 번 더!`);}
  else{
    if(S.mode==='solo'){S.turn++}
    else{S.idx=(S.idx+1)%S.players.length; if(S.idx===0)S.turn++}
    let guard=0;
    while(cur().skip&&guard<20){
      const q=cur();q.skip=false;addLog(`${nm(q)} 💤 쉬는 턴이에요.`);toast(`💤 ${q.name} 이번 턴은 쉬어요`);
      if(S.mode==='solo'){S.turn++}else{S.idx=(S.idx+1)%S.players.length;if(S.idx===0)S.turn++}
      guard++;
    }
  }
  S.busy=false;renderAll();
}
async function resolve(p,depth){
  const c=p.pos;
  if(P.ladders[c]){
    const to=P.ladders[c];let ok=true;
    if(S.rule==='event') ok=await askQuiz(p,'🪜','사다리 찬스!',`맞히면 ${to}번 칸으로 올라가요.`);
    if(ok){SFX.up();addLog(`${nm(p)} 🪜 사다리 타고 ${to}번으로!`);await flyTo(p,to)}
    else addLog(`${nm(p)} 사다리를 놓쳤어요.`);
    return false;
  }
  if(P.snakes[c]){
    const to=P.snakes[c];
    if(p.shield>0){p.shield--;SFX.item();await itemPopup('🛡️','방패 발동!','뱀을 막아냈어요.');addLog(`${nm(p)} 🛡️ 방패로 뱀을 막았어요.`);renderPlayers();return false}
    let ok=false;
    if(S.rule==='event') ok=await askQuiz(p,'🐍','뱀이 나타났다!',`맞히면 피하고, 틀리면 ${to}번 칸으로 미끄러져요.`);
    if(ok){addLog(`${nm(p)} 🐍 뱀을 피했어요!`)}
    else{SFX.down();addLog(`${nm(p)} 🐍 뱀에게 물려 ${to}번으로…`);await flyTo(p,to)}
    return false;
  }
  if(depth>0)return false;
  if(P.quiz.includes(c)){
    const ok=await askQuiz(p,'❓','보너스 퀴즈','맞히면 주사위를 한 번 더 굴려요.');
    if(ok)addLog(`${nm(p)} ❓ 보너스 성공!`);
    return ok;
  }
  const it=P.items[c];
  if(it){
    SFX.item();
    if(it==='fwd2'){await itemPopup('🚀','앞으로 2칸',ITEMS.fwd2.desc);await moveSteps(p,2);addLog(`${nm(p)} 🚀 2칸 전진`);if(p.pos===last())return false;return resolve(p,1)}
    if(it==='back1'){await itemPopup('🍌','뒤로 1칸',ITEMS.back1.desc);await moveSteps(p,-1);addLog(`${nm(p)} 🍌 1칸 후퇴`);return resolve(p,1)}
    if(it==='skip'){await itemPopup('💤','한 턴 쉬기',ITEMS.skip.desc);p.skip=true;addLog(`${nm(p)} 💤 다음 턴 쉬기`);renderPlayers();return false}
    if(it==='again'){await itemPopup('⭐','한 번 더!',ITEMS.again.desc);addLog(`${nm(p)} ⭐ 한 번 더`);return true}
    if(it==='shield'){await itemPopup('🛡️','방패 획득',ITEMS.shield.desc);p.shield++;addLog(`${nm(p)} 🛡️ 방패 획득`);renderPlayers();return false}
    if(it==='swap'){
      if(S.mode==='solo'){await itemPopup('🎰','혼자라서 보너스!','바꿀 상대가 없으니 1칸 앞으로 가요.');await moveSteps(p,1);return resolve(p,1)}
      const others=S.players.filter(q=>q!==p),lead=others.reduce((a,b)=>b.pos>a.pos?b:a);
      let target,rise;
      if(lead.pos>p.pos){target=lead;rise=true}
      else{
        const tail=others.reduce((a,b)=>b.pos<a.pos?b:a);
        if(tail.pos>=p.pos){await itemPopup('🎰','인생역전 불발…','모두 같은 칸이라 바뀔 자리가 없어요.');return false}
        target=tail;rise=false;
      }
      if(rise) await lifeSwap(p,target);
      else{SFX.down();await itemPopup('📉','선두의 추락…',`1등이라 꼴찌인 ${target.name}(${target.pos}칸)와 자리가 바뀌어요.`)}
      const a=p.pos;p.pos=target.pos;target.pos=a;
      document.querySelectorAll('#tokens .token').forEach(e=>e.classList.add('fly'));renderTokens();await sleep(750);
      document.querySelectorAll('#tokens .token').forEach(e=>e.classList.remove('fly'));
      addLog(rise?`${nm(p)} 🎰 인생역전! ${nm(target)}의 자리를 차지했어요.`:`${nm(p)} 📉 선두의 추락! ${nm(target)}와 자리가 바뀌었어요.`);
      renderPlayers();return false;
    }
    if(it==='box'){
      const r=BOX[Math.floor(Math.random()*BOX.length)];
      await itemPopup('🎁','랜덤 박스 오픈…','두구두구두구');
      await itemPopup(r.icon,r.name,'');
      addLog(`${nm(p)} 🎁 ${r.name}`);
      if(r.act==='fwd'){await moveSteps(p,r.n);if(p.pos===last())return false;return resolve(p,1)}
      if(r.act==='warp'){const k=1+Math.floor(Math.random()*4);toast(`🌀 ${k}칸 순간이동`);await flyTo(p,Math.min(last(),p.pos+k));if(p.pos===last())return false;return resolve(p,1)}
      if(r.act==='back'){await moveSteps(p,-r.n);return resolve(p,1)}
      if(r.act==='skip'){p.skip=true;renderPlayers();return false}
      if(r.act==='again')return true;
      if(r.act==='shield'){p.shield++;renderPlayers();return false}
    }
  }
  return false;
}

}
function openModal(html){

function itemPopup(icon,title,desc){

  });
}
function nextQ(){
  if(!qPool.length){qPool=QUESTIONS.map((_,i)=>i);for(let i=qPool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[qPool[i],qPool[j]]=[qPool[j],qPool[i]]}}
  return QUESTIONS[qPool.pop()];
}
function askQuiz(p,icon,title,sub){
  return new Promise(res=>{
    const q=nextQ();
    const tag={mc:'객관식',ox:'O / X',short:'단답형'}[q.type];
    let body='';
    if(q.type==='mc') body=`<div class="opts">${q.opts.map((o,i)=>`<button class="btn opt" data-i="${i}"><span class="k">${i+1}</span><span>${esc(o)}</span></button>`).join('')}</div>`;
    if(q.type==='ox') body=`<div class="opts two"><button class="btn opt" data-i="O">O</button><button class="btn opt" data-i="X">X</button></div>`;
    if(q.type==='short') body=`<div class="center"><button class="btn big" id="reveal">정답 확인하기</button><p class="sub" style="margin-top:10px">답을 말한 뒤 눌러 주세요.</p></div>`;
    const m=openModal(`
      <div class="mh"><span class="big">${icon}</span><div><h3>${esc(title)}</h3><div class="sub" style="margin:0">${nm(p)} · ${esc(sub)}</div></div></div>
      ${S.timer?'<div class="timer"><div></div></div>':''}
      <div class="qbox"><span class="qtag">${tag}</span><br>${esc(q.q)}</div>
      <div id="qbody">${body}</div><div id="qres"></div><div class="mfoot" id="qfoot"></div>`);
    let done=false,tid=null;
    const finish=ok=>{
      if(done)return;done=true;clearInterval(tid);
      p.total++; if(ok)p.correct++; else if(S.mode==='solo')S.wrong.push(q);
      ok?SFX.good():SFX.bad();
      const ans=q.type==='mc'?`${q.a+1}번 · ${q.opts[q.a]}`:q.a;
      m.querySelector('#qres').innerHTML=`<div class="result ${ok?'ok':'no'}">${ok?'⭕ 정답!':'❌ 아쉬워요'}<br><span class="ans">정답: ${esc(ans)}</span>${q.exp?`<br>💡 ${esc(q.exp)}`:''}</div>`;
      const f=m.querySelector('#qfoot');f.innerHTML='<button class="btn big green">계속하기 ▶</button>';
      const b=f.querySelector('button');b.focus();b.onclick=()=>{m.remove();renderPlayers();res(ok)};
    };
    const mark=(pick)=>{
      m.querySelectorAll('.opt').forEach(b=>{b.disabled=true;
        const v=q.type==='mc'?+b.dataset.i:b.dataset.i, right=q.type==='mc'?q.a:q.a;
        if(v===right)b.classList.add('right'); else if(v===pick)b.classList.add('wrong');});
    };
    m.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const v=q.type==='mc'?+b.dataset.i:b.dataset.i;mark(v);finish(v===q.a);
    });
    const reveal=()=>{
      clearInterval(tid);
      m.querySelector('#qbody').innerHTML=`<div class="result" style="background:var(--gold);color:#1a1530"><span class="ans">정답: ${esc(q.a)}</span>${q.exp?`<br>💡 ${esc(q.exp)}`:''}</div>
        <p class="sub center" style="margin-top:12px">맞혔나요?</p>
        <div class="opts two"><button class="btn opt green" id="yes" style="font-family:var(--ko);font-size:28px">⭕ 맞혔어요</button><button class="btn opt red" id="no" style="font-family:var(--ko);font-size:28px">❌ 틀렸어요</button></div>`;
      const fin=ok=>{
        if(done)return;done=true;p.total++;if(ok)p.correct++;else if(S.mode==='solo')S.wrong.push(q);
        ok?SFX.good():SFX.bad();m.remove();renderPlayers();res(ok);
      };
      m.querySelector('#yes').onclick=()=>fin(true);m.querySelector('#no').onclick=()=>fin(false);
    };
    const rv=m.querySelector('#reveal');if(rv)rv.onclick=reveal;
    if(S.timer){
      const bar=m.querySelector('.timer div'),wrap=m.querySelector('.timer'),t0=Date.now(),T=S.timer*1000;
      tid=setInterval(()=>{
        const left=Math.max(0,T-(Date.now()-t0));bar.style.width=(left/T*100)+'%';
        wrap.classList.toggle('warn',left<5000);
        if(left<5000&&Math.floor(left/1000)!==Math.floor((left+100)/1000))beep(1200,.04);
        if(left<=0){clearInterval(tid);
          if(q.type==='short'){toast('⏰ 시간 종료! 정답을 확인해요');reveal()}
          else{toast('⏰ 시간 종료!');mark(null);finish(false)}
        }
      },100);
    }
  });
}

    d.innerHTML=`<div class="rays"></div><div class="inner">

$('#rollBtn').onclick=takeTurn;
$('#dice').onclick=takeTurn;
$('#dice').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();takeTurn()}};
$('#soundBtn').onclick=()=>{S.sound=!S.sound;cfg.sound=S.sound?1:0;store.set('sl_cfg',cfg);updateSoundBtn()};
$('#restartBtn').onclick=async()=>{if(S.busy&&!S.over){toast('움직임이 끝난 뒤 눌러 주세요');return}if(await askConfirm('다시 하기','같은 설정으로 처음부터 다시 할까요?','다시 하기')){$('#tokens').innerHTML='';startGame()}};
$('#homeBtn').onclick=async()=>{if(S.busy&&!S.over){toast('움직임이 끝난 뒤 눌러 주세요');return}if(await askConfirm('설정 화면으로','진행 중인 게임을 끝내고 설정 화면으로 갈까요?','나가기'))goHome()};
window.addEventListener('resize',()=>{if(P&&!$('#game').classList.contains('hidden'))renderTokens()});
</script>
</body>
</html>
